name: Unzip and Build ClearSMS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Unzip SMS-clean.zip
        run: unzip -q -o SMS-clean.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: project/ClearSMS-main

      - name: Build debug APK
        working-directory: project/ClearSMS-main
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClearSMS-debug-apk
          path: project/ClearSMS-main/app/build/outputs/apk/debug/*.apk
